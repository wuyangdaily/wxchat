name: Docker Image CI

# 触发条件：
# 1. 手动触发 workflow_dispatch
# 2. 自动触发 create（新分支或新标签）
on:
  workflow_dispatch:  # 手动触发
  create:             # 自动触发：新分支或标签

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: Docker

    steps:
    # 1️⃣ 拉取仓库代码
    - uses: actions/checkout@v7

    # 2️⃣ 登录 Docker Hub（使用 Secrets）
    - name: Docker Login
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # 3️⃣ 构建并推送 Docker 镜像
    - name: Build and Push the Docker image
      run: |
        sudo apt-get update && sudo apt-get install -y qemu-user-static

        docker buildx create --name multiarch --use || docker buildx use multiarch

        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          IMAGE_TAG="${GITHUB_REF##*/}"
        else
          IMAGE_TAG="latest"
        fi

        echo "Building and pushing image with tag: $IMAGE_TAG"

        docker buildx build \
          --platform linux/386,linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/s390x \
          -t ${{ secrets.DOCKER_USERNAME }}/wxchat:$IMAGE_TAG \
          --push .

    # 4️⃣ 登出 Docker Hub
    - name: Docker Logout
      run: docker logout
