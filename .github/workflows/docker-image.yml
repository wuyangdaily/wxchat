name: Docker Image CI

on:
  workflow_dispatch:
  create:

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: Docker

    steps:
    # 1️⃣ 拉取仓库代码
    - uses: actions/checkout@v4

    # 2️⃣ 登录 Docker Hub
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3️⃣ QEMU
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    # 4️⃣ Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # 5️⃣ 构建并推送
    - name: Build and Push the Docker image
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          IMAGE_TAG="${GITHUB_REF##*/}"
        else
          IMAGE_TAG="latest"
        fi

        echo "Building and pushing image with tag: $IMAGE_TAG"

        docker buildx build \
          --platform linux/386,linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/s390x \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t ${{ secrets.DOCKER_USERNAME }}/wxchat:$IMAGE_TAG \
          --push .

    # 6️⃣ 登出 Docker Hub
    - name: Docker Logout
      if: always()
      run: docker logout